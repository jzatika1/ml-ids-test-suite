[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-ids-test-suite"
version = "0.2.0"
description = "Machine-learning IDS test suite presented at IEEE/ACM UCC 2024."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Anthony Zatika"},
  {name = "Joel Coffman"}
]
dependencies = [
  "joblib>=1.3",
  "numpy>=1.24",
  "optuna>=3.6",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "urllib3>=2.0",
  "xgboost>=2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4"
]
deep-learning = [
  "tensorflow>=2.15"
]

[tool.setuptools.packages.find]
include = [
  "DataPreprocessing*",
  "HyperparameterOptimization*",
  "ModelTraining*",
  "NetworkMonitor*"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
